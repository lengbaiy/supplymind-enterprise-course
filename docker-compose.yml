services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: supplymind
      POSTGRES_USER: supplymind
      POSTGRES_PASSWORD: supplymind
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supplymind -d supplymind"]
      interval: 5s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redis_data:/data]
  api:
    build: ./backend
    env_file: .env
    environment:
      SUPPLYMIND_DATABASE_URL: postgresql+psycopg://supplymind:supplymind@postgres:5432/supplymind
      SUPPLYMIND_REDIS_URL: redis://redis:6379/0
      SUPPLYMIND_INGESTION_MODE: broker
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
  worker:
    build: ./backend
    command: celery -A scripts.worker.celery_app worker --loglevel=INFO
    env_file: .env
    environment:
      SUPPLYMIND_DATABASE_URL: postgresql+psycopg://supplymind:supplymind@postgres:5432/supplymind
      SUPPLYMIND_REDIS_URL: redis://redis:6379/0
      SUPPLYMIND_INGESTION_MODE: broker
    depends_on: [postgres, redis]
  frontend:
    build: ./frontend
    environment: { VITE_API_BASE_URL: http://localhost:8000/api/v1 }
    ports: ["5173:5173"]
    depends_on: [api]
  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: [observability]
    volumes: ["./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:11.3.0
    profiles: [observability]
    ports: ["3000:3000"]
volumes:
  postgres_data:
  redis_data:
