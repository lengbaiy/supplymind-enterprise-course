[project]
name = "supplymind-api"
version = "0.1.0"
description = "Multi-tenant supply-chain analytics API"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.14,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "asyncpg>=0.30,<1.0",
  "aiosqlite>=0.20,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "pyjwt>=2.10,<3.0",
  "pwdlib[argon2]>=0.2,<1.0",
  "cryptography>=44,<46",
  "sqlglot>=26,<28",
  "httpx>=0.28,<1.0",
  "prometheus-client>=0.21,<1.0",
  "opentelemetry-api>=1.29,<2.0",
  "opentelemetry-sdk>=1.29,<2.0",
  "opentelemetry-instrumentation-fastapi>=0.50b0,<1.0",
  "celery[redis]>=5.4,<6.0",
  "aiomysql>=0.2,<1.0",
  "pypdf>=5.0,<6.0",
  "reportlab>=4.2,<5.0",
  "boto3>=1.35,<2.0",
  "python-multipart>=0.0.20,<1.0",
  "openpyxl>=3.1,<4.0",
  "langgraph>=0.2,<1.0",
  "langchain-core>=0.3,<1.0",
  "pgvector>=0.3,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B008"]

[tool.setuptools.packages.find]
include = ["app*"]
