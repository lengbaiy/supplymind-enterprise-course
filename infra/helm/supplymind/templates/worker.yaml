apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector: { matchLabels: { app: {{ .Release.Name }}-worker } }
  template:
    metadata: { labels: { app: {{ .Release.Name }}-worker } }
    spec:
      containers:
        - name: worker
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
          command: ["celery"]
          args: ["-A", "scripts.worker.celery_app", "worker", "--loglevel=INFO", "--queues=analysis"]
          envFrom:
            - configMapRef: { name: {{ .Release.Name }}-config }
            - secretRef: { name: {{ .Values.existingSecret }} }
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
          livenessProbe:
            exec: { command: ["python", "-c", "import sys; sys.exit(0)"] }
            initialDelaySeconds: 20
            periodSeconds: 30
---
{{- if .Values.workerAutoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: {{ .Release.Name }}-worker }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ .Release.Name }}-worker }
  minReplicas: {{ .Values.workerAutoscaling.minReplicas }}
  maxReplicas: {{ .Values.workerAutoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: {{ .Values.workerAutoscaling.targetCPUUtilizationPercentage }} } }
{{- end }}
