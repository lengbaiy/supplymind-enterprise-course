name: supplymind-ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[dev]"
      - run: pytest -q
      - run: python -m scripts.evaluation_gate
      - run: ruff check app scripts tests
      - run: python -m compileall -q app
      - run: test "$(alembic heads | wc -l)" -eq 1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  frontend-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d postgres redis minio demo-postgres retail-postgres demo-mysql
      - run: docker compose run --rm api alembic upgrade head
      - run: docker compose up -d --build api worker frontend
      - run: until curl --fail --silent http://127.0.0.1:8000/api/v1/health/ready; do sleep 2; done
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: PLAYWRIGHT_BASE_URL=http://127.0.0.1:5173 npm run test:e2e
      - if: always()
        run: docker compose logs --no-color > compose-e2e.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-e2e-logs
          path: compose-e2e.log

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint infra/helm/supplymind
      - run: helm template supplymind infra/helm/supplymind > /tmp/supplymind-manifest.yaml

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: SUPPLYMIND_ENV_FILE=.env.example docker compose config --quiet
      - run: SUPPLYMIND_TRIAL_ENV_FILE=.env.trial.example docker compose --env-file .env.trial.example -f docker-compose.yml -f docker-compose.trial.yml config --quiet

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "./backend[dev]" pip-audit
      - run: pip-audit --strict
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm audit --prefix frontend --audit-level=high
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - run: docker build -t supplymind-api:ci ./backend
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: supplymind-api:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: supplymind-sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: supplymind-sbom
          path: supplymind-sbom.cdx.json
